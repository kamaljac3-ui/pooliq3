<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model viewer</title>
<style>
  html,body{margin:0;height:100%;background:#1b1612;overflow:hidden;font-family:Consolas,monospace;color:#ddd}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;left:16px;bottom:14px;font-size:12px;display:flex;gap:10px;align-items:center}
  input[type=range]{width:360px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><span>growth</span><input id="g" type="range" min="0" max="1" step="0.005" value="1"><span id="gv">1.00</span></div>
<script type="module" src="/src/viewer.js"></script>
</body>
</html>
